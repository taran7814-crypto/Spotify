<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="-yHfPN69mBkV6EbKAGNRwVMSGPx5JzzCJUAy-cPqHbs" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <title>Spotify - Web Player</title>

    <script>
      window.APP_BASE_PATH = location.hostname.endsWith("github.io")
        ? "/Spotify/"
        : "/";
      document.write('<base href="' + window.APP_BASE_PATH + '">');
    </script>

    <link rel="stylesheet" href="%BASE_URL%CSS/style.css" />
    <link rel="stylesheet" href="%BASE_URL%CSS/utility.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="spotify-logo" href="./" aria-label="Spotify home">
          <img src="%BASE_URL%/img/logo.svg" alt="Spotify" />
        </a>

        <button class="home-button" id="topHome" type="button" aria-label="Home">
          <img src="%BASE_URL%img/home.svg" alt="" />
        </button>

        <label class="search-box">
          <img src="%BASE_URL%img/search.svg" alt="" />
          <input
            type="search"
            id="topSearchInput"
            placeholder="What do you want to play?"
            aria-label="Search songs and playlists"
          />
        </label>

        <div class="account-buttons">
          <button class="signupbtn" type="button">Sign up</button>
          <button class="loginbtn" type="button">Log in</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="left-panel" id="libraryPanel">
          <section class="library">
            <div class="library-heading">
              <img src="%BASE_URL%img/playlist.svg" alt="" />
              <h2>Your Playlist</h2>
            </div>
            <div class="songList"><ul></ul></div>
          </section>
        </aside>

        <section class="right-panel">
          <div class="spotifyPlaylists">
            <h1>Spotify Playlists</h1>

            <section id="albumPage" hidden>
              <button id="backToAlbums" type="button" aria-label="Back to albums">
                ×
              </button>
              <div id="albumHeader"></div>
              <div id="albumContent"></div>
            </section>

            <div class="cardContainer"></div>
          </div>
        </section>

        <footer class="playbar">
          <div class="player-left">
            <div class="songinfo">No song selected</div>
          </div>

          <div class="player-center">
            <div class="songbuttons">
              <button class="transport-button" type="button" aria-label="Previous">
                <img id="previous" src="%BASE_URL%img/prevsong.svg" alt="Previous" />
              </button>

              <button class="main-play-button" id="play" type="button" aria-label="Play">
                <img src="%BASE_URL%img/play.svg" alt="Play" />
              </button>

              <button class="transport-button" type="button" aria-label="Next">
                <img id="next" src="%BASE_URL%img/nextsong.svg" alt="Next" />
              </button>
            </div>

            <div class="progress-row">
              <span class="current-time">00:00</span>
              <div
                class="seekbar"
                role="slider"
                aria-label="Seek through song"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div class="circle"></div>
              </div>
              <span class="song-duration">00:00</span>
            </div>
          </div>

          <div class="player-right">
            <button
              class="queue-button"
              id="queueButton"
              type="button"
              aria-label="Open library and queue"
              title="Queue / Library"
            >
              <span class="queue-glyph" aria-hidden="true">☷</span>
            </button>

            <div class="volume">
              <img src="%BASE_URL%img/volume.svg" alt="Volume" />
              <div class="range">
                <input
                  type="range"
                  name="volume"
                  min="0"
                  max="100"
                  value="100"
                  aria-label="Volume"
                />
              </div>
            </div>
          </div>
        </footer>
      </main>

      <button
        class="mobile-drawer-backdrop"
        id="drawerBackdrop"
        type="button"
        aria-label="Close library"
        hidden
      ></button>
    </div>

    <script src="%BASE_URL%JS/script.js"></script>
  </body>
</html>
